<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pauza mezi třetinami · Hokejová analytika</title>
  <meta name="description" content="Hokejová analytika Tipsport extraligy se připravuje na novou sezónu. Brzy jsme zpět.">
  <meta name="robots" content="noindex">

  <!-- Open Graph / social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pauza mezi třetinami · Hokejová analytika">
  <meta property="og:description" content="Web se připravuje na novou sezónu Tipsport extraligy. Brzy jsme zpět.">
  <meta property="og:url" content="https://hokejovaanalytika.cz/">
  <meta property="og:image" content="https://hokejovaanalytika.cz/logos/profilovka.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@hokejanalytika">

  <link rel="icon" href="logos/profilovka.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --slate:      #1B2B34;
      --slate-deep: #142128;
      --petrolej:   #2A8B8B;
      --petrolej-lt:#3FB3B3;
      --zlata:      #D4A843;
      --text:       #E7EDEF;
      --text-dim:   #8FA3AB;
      --line:       rgba(63, 179, 179, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      color: var(--text);
      background: var(--slate);
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(42, 139, 139, 0.22), transparent 70%),
        radial-gradient(ellipse 60% 50% at 50% 120%, rgba(212, 168, 67, 0.06), transparent 70%),
        var(--slate);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--line);
      box-shadow: 0 0 0 6px rgba(42, 139, 139, 0.08);
      margin-bottom: 30px;
      background: var(--slate-deep);
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--petrolej-lt);
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 3.4rem);
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }
    h1 .accent { color: var(--zlata); }

    .lead {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-dim);
      max-width: 420px;
      margin-bottom: 40px;
    }

    /* Scoreboard status panel — the signature element */
    .board {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      font-family: 'JetBrains Mono', monospace;
      background: linear-gradient(180deg, var(--slate-deep), rgba(20, 33, 40, 0.6));
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 22px;
      margin-bottom: 48px;
    }
    .board .label {
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .board .sep { width: 1px; height: 22px; background: var(--line); }
    .board .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--zlata);
      text-transform: uppercase;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--zlata);
      box-shadow: 0 0 8px rgba(212, 168, 67, 0.7);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.82); }
    }

    footer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 16px;
    }
    footer a {
      color: var(--text-dim);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
      padding: 2px 0;
    }
    footer a:hover,
    footer a:focus-visible {
      color: var(--petrolej-lt);
      border-bottom-color: var(--petrolej-lt);
    }
    footer a:focus-visible { outline: 2px solid var(--petrolej-lt); outline-offset: 4px; border-radius: 2px; }
    footer .divider { color: var(--line); }

    @media (max-width: 380px) {
      .board { gap: 12px; padding: 12px 16px; }
      .board .status { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="logos/profilovka.png" alt="Hokejová analytika" onerror="this.style.display='none'">

    <p class="eyebrow">Hokejová analytika · Tipsport extraliga</p>

    <h1>Pauza mezi <span class="accent">třetinami</span></h1>

    <p class="lead">Web se připravuje na novou sezónu. Brzy jsme zpět s kompletními statistikami a analýzou.</p>

    <div class="board" role="status" aria-label="Stav webu: přestávka">
      <span class="label">Stav</span>
      <span class="sep" aria-hidden="true"></span>
      <span class="status"><span class="dot" aria-hidden="true"></span>Přestávka</span>
    </div>

    <footer>
      <a href="https://twitter.com/hokejanalytika">@hokejanalytika</a>
      <span class="divider" aria-hidden="true">/</span>
      <a href="mailto:hockeyanalyticscz@proton.me">hockeyanalyticscz@proton.me</a>
    </footer>
  </main>
</body>
</html>
